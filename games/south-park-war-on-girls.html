<script>
'use strict';
/* =====================================================================
   SOUTH PARK: WAR ON GIRLS  -  fan game engine
   Modular cut-out rig + slot-based asset system. All character art comes
   from PNG slots in spwog-assets/ (see manifest.json). Empty slots render
   as plain labelled placeholders so nothing is faked.
   ===================================================================== */
const W = 1280, H = 720, GROUND = 600, DT = 1 / 60;
const $ = (s) => document.querySelector(s);
const cv = $('#cv'), cx = cv.getContext('2d');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a), irnd = (a, b) => Math.floor(rnd(a, b + 1));
const sgn = (v) => (v < 0 ? -1 : 1);

/* ---------------- asset slots ---------------- */
const BASE = 'spwog-assets/';
const EXPR = { eyes: ['open', 'half', 'closed', 'wide', 'angry', 'sad'], brows: ['neutral', 'angry', 'sad', 'raised'],
  mouth: ['neutral', 'talk_a', 'talk_b', 'shout', 'laugh', 'angry', 'sad', 'surprised', 'confused', 'smirk'], hand: ['open', 'fist', 'point', 'grab'] };
const PART_FILES = (() => {
  const f = ['head', 'torso', 'arm_l', 'arm_r', 'leg_l', 'leg_r', 'foot_l', 'foot_r', 'hat', 'clothing_top', 'clothing_bottom', 'accessory_face', 'accessory_back'];
  EXPR.eyes.forEach((e) => f.push('eyes_' + e)); EXPR.brows.forEach((e) => f.push('brows_' + e)); EXPR.mouth.forEach((e) => f.push('mouth_' + e));
  ['l', 'r'].forEach((s) => EXPR.hand.forEach((h) => f.push('hand_' + s + '_' + h)));

})();
/* Character cast. Names only: no designs are baked in. Art comes from the slots. */
const CAST = {
  stan: { name: 'Stan', side: 'boys', playable: true, special: ['Eye Roll Shield', 'shield'], speed: 1.0, hp: 100 },
  kyle: { name: 'Kyle', side: 'boys', playable: true, special: ['Moral Lecture', 'blast'], speed: 1.0, hp: 100 },
  cartman: { name: 'Cartman', side: 'boys', playable: true, special: ['Respect My Authoritah', 'stun'], speed: 0.9, hp: 130 },
  kenny: { name: 'Kenny', side: 'boys', playable: true, special: ['Muffled Rage', 'dash'], speed: 1.15, hp: 80 },
  butters: { name: 'Butters', side: 'boys', playable: true, special: ['Panic Spiral', 'spin'], speed: 1.05, hp: 90 },

  victoria: { name: 'Principal Victoria', side: 'adults', boss: true }, mayor: { name: 'The Mayor', side: 'adults' },

const ENV_SLOTS = (() => { const o = []; ['bus_stop', 'cafeteria', 'playground', 'town_hall', 'finale'].forEach((l) => ['sky', 'far', 'mid', 'near', 'foreground', 'ground'].forEach((k) => o.push(`env/${l}/${k}.png`)));
  ['snowball', 'glitter_ball', 'hall_pass', 'cheesy_snack', 'clipboard', 'tray', 'fort_piece', 'rope', 'crate', 'sign', 'bench', 'tree', 'house_a', 'house_b', 'lamp', 'table'].forEach((p) => o.push(`props/${p}.png`));

const present = new Set();   // files listed in spwog-assets/available.json
const imgs = new Map();
function slotPath(id, part) { return `chars/${id}/${part}.png`; }

/* ---------------- rig ---------------- */

const PLACE = { fill: '#dde1e6', line: '#4b5360', dark: '#c3c9d1' };

  const w = p[4], h = p[5]; c.fillStyle = PLACE.fill; c.strokeStyle = PLACE.line; c.lineWidth = 3;

const BODY_SCALE = 1;
/* draw one character with pose. id = cast key. opts: flip, scale, tint, expr, talk, tag */
function drawChar(c, id, pose, x, y, o) {
  o = o || {}; const sc = (o.scale || 1) * BODY_SCALE, flip = o.flip ? -1 : 1, root = pose.root;
  c.save(); c.translate(x, y); c.scale(flip * sc * root.sx, sc * root.sy); c.rotate(root.r); c.translate(root.x, root.y);

  const variantOf = (n) => (n === 'eyes' ? eyeEx : n === 'brows' ? brEx : n === 'mouth' ? moEx : n === 'hand_l' ? hl : n === 'hand_r' ? hr : null);
  const stack = (n) => { const p = RIGBY[n]; return p[1] ? [...stack(p[1]), n] : [n]; };
  for (const n of DRAW_ORDER) {
    c.save();
    for (const a of stack(n)) { const p = RIGBY[a], po = pose[a]; c.translate(p[2] + po.x, p[3] + po.y); c.rotate(po.r); }

    if (o.showSlots && !im && !['eyes', 'brows', 'mouth', 'hat', 'clothing_top', 'clothing_bottom', 'accessory_face', 'accessory_back'].includes(n)) { /* debug handled by caller */ }

  }
  c.restore();
  if (o.tag) { c.save(); c.font = '600 15px system-ui,sans-serif'; c.textAlign = 'center'; const tw = c.measureText(o.tag).width + 16;
    c.fillStyle = 'rgba(10,12,16,.72)'; c.beginPath(); c.roundRect(x - tw / 2, y - 232 * sc - 4, tw, 24, 12); c.fill(); c.fillStyle = '#f2f4f7'; c.fillText(o.tag, x, y - 232 * sc + 13); c.restore(); }
}
function drawHeadOnly(c, id, x, y, size, exprs, mouth) {   // portraits: head + face slots
  const pose = newPose(); c.save(); c.translate(x, y); const s = size / 130; c.scale(s, s);
  const head = RIGBY.head; c.translate(0, 70);
  const im = getImg(slotPath(id, 'head')); if (im) c.drawImage(im, -head[6] * head[4], -head[7] * head[5], head[4], head[5]); else drawPlaceholder(c, head, 'head');
  ['eyes', 'brows', 'mouth'].forEach((n) => { const p = RIGBY[n], v = n === 'eyes' ? exprs.eyes : n === 'brows' ? exprs.brows : mouth;
    c.save(); c.translate(p[2], p[3]); const f = getImg(slotPath(id, `${n}_${v}`)); if (f) c.drawImage(f, -p[6] * p[4], -p[7] * p[5], p[4], p[5]); else drawFacePlaceholder(c, n, v); c.restore(); });

/* ---------------- facial expressions ---------------- */
const FACES = { neutral: { eyes: 'open', brows: 'neutral', mouth: 'neutral' }, talking: { eyes: 'open', brows: 'neutral', mouth: 'talk' },
  shouting: { eyes: 'angry', brows: 'angry', mouth: 'shout' }, laughing: { eyes: 'closed', brows: 'raised', mouth: 'laugh' }, angry: { eyes: 'angry', brows: 'angry', mouth: 'angry' },
  sad: { eyes: 'sad', brows: 'sad', mouth: 'sad' }, surprised: { eyes: 'wide', brows: 'raised', mouth: 'surprised' }, confused: { eyes: 'half', brows: 'raised', mouth: 'confused' },
  smirk: { eyes: 'half', brows: 'neutral', mouth: 'smirk' }, hurt: { eyes: 'closed', brows: 'sad', mouth: 'shout' }, victory: { eyes: 'open', brows: 'raised', mouth: 'laugh' } };

/* ---------------- animation (procedural over the rig) ---------------- */
const ANIMS = ['idle', 'walk', 'run', 'attack', 'throw', 'hurt', 'jump', 'fall', 'victory', 'defeat', 'special', 'taunt', 'panic'];
function poseFor(anim, t, speed, k) {   // k: 0..1 progress for one-shots
  const p = newPose(), s = Math.sin, r = (n, v) => { p[n].r = v; };
  const swing = (amp, fq) => { const a = s(t * fq) * amp; r('leg_l', a); r('leg_r', -a); r('arm_l', -a * .9); r('arm_r', a * .9); r('foot_l', -a * .25); r('foot_r', a * .25); r('hand_l', .1); r('hand_r', -.1); };
  if (anim === 'idle') { const b = s(t * 2.2); p.torso.y = b * 1.5; p.head.y = b * 1; r('arm_l', .07 + b * .03); r('arm_r', -.07 - b * .03); r('torso', b * .015); p.root.sy = 1 + b * .006; }
  else if (anim === 'walk') { swing(.55, 9); p.pelvis.y = -Math.abs(s(t * 9)) * 5; r('torso', .05); p.head.r = -.03; }
  else if (anim === 'run') { swing(.95, 14); p.pelvis.y = -Math.abs(s(t * 14)) * 8; r('torso', .18); p.head.r = -.1; r('arm_l', -1.0 * s(t * 14) - .35); r('arm_r', 1.0 * s(t * 14) - .35); p.root.r = .05; }
  else if (anim === 'attack') { const w = k < .3 ? -k / .3 : (k - .3) / .7; const e = k < .3 ? k / .3 : 1 - (k - .3) / .7; r('torso', .25 * e); r('arm_r', k < .3 ? lerp(-.2, -2.2, k / .3) : lerp(-2.2, 1.3, (k - .3) / .15 > 1 ? 1 : (k - .3) / .15)); r('arm_l', .5); r('leg_l', -.35 * e); r('leg_r', .3 * e); p.root.x = e * 10; }
  else if (anim === 'throw') { const e = Math.sin(k * Math.PI); r('arm_r', lerp(-2.6, 0.5, k)); r('torso', -.12 + e * .25); r('arm_l', .3); r('leg_l', -.2); r('leg_r', .25); }

  else if (anim === 'jump') { r('leg_l', -.7); r('leg_r', .5); r('arm_l', -2.4); r('arm_r', -2.2); r('torso', -.05); p.root.sy = 1.04; }
  else if (anim === 'fall') { r('leg_l', .5); r('leg_r', -.4); r('arm_l', -1.3 + s(t * 14) * .25); r('arm_r', -1.3 - s(t * 14) * .25); p.root.sy = .97; p.head.r = .1; }

  else if (anim === 'special') { const e = Math.sin(clamp(k, 0, 1) * Math.PI); r('arm_l', -2.9 * e); r('arm_r', -2.9 * e); r('torso', -.15 * e); p.root.sy = 1 + e * .06; p.root.sx = 1 - e * .03; }

/* ---------------- audio (WebAudio synth, optional file slots) ---------------- */
const AU = { ctx: null, vol: 0.6, mute: false };

/* ---------------- input ---------------- */
